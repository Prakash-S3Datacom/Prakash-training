
services:
  db:
    image: postgres:17
    container_name: task-postgres
    restart: unless-stopped
    env_file:
      - ./backend/task-crud-api integrating postgres/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-taskdb}
    ports:
      - "5434:5432"
    volumes:
      - task_data:/var/lib/postgresql/data
      - ./backend/task-crud-api integrating postgres/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-taskdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/task-crud-api integrating postgres
    container_name: task-api
    restart: unless-stopped
    env_file:
      - ./backend/task-crud-api integrating postgres/.env
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/task-ui
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  task_data:
